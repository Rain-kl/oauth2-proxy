name: Release Docker Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish, for example v7.13.0
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish GHCR images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          repo_path="${GITHUB_REPOSITORY,,}"
          pointed_tag="$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n1)"
          input_version="${INPUT_VERSION//[[:space:]]/}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME}"
          elif [[ -n "${input_version}" ]]; then
            version="${input_version}"
          elif [[ -n "${pointed_tag}" ]]; then
            version="${pointed_tag}"
          else
            echo "workflow_dispatch requires a version when HEAD is not tagged" >&2
            exit 1
          fi

          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "REGISTRY=ghcr.io/${repo_path%/*}" >> "$GITHUB_ENV"
          echo "REPOSITORY=${repo_path#*/}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: make push-docker VERSION="${VERSION}" REGISTRY="${REGISTRY}" REPOSITORY="${REPOSITORY}"